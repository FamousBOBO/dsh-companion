# vocechat-adapter bundle patch: the VoceChat → DSH turn adapter.
#
# 这个行是**适配层**，住在 host 平面（它要 `agents` / `agentPresets`，那是宿主服务，
# preset 平面看不到）。它与 `channel-vocechat`（传输行）是兄弟行，中间靠
# `companionVoceChat` 端口相连。
#
# 分工（不可混）：
#   传输行  事件归一化、落盘、幂等、after_mid 游标、出站 HTTP、SSE 重连与续期
#   本适配行 房间键、门控、会话供给、回合驱动、队列、发送账本、兜底纠正、vc_message
#
# 部署相关值写在 profile 的 user 层（会整段替换本行的 `config`）。
- insert:
    - id: vocechat-adapter
      name: '@dsh-companion/vocechat-adapter'
      config:
        # false = 挂载但不订阅、不驱动（传输行照常收事件并落盘）。
        enabled: true

        # 传输端口的名字。`companion-foundation/service-bridge.mjs` 的白名单里必须有同一个名字。
        name: 'companionVoceChat'

        # G5 多实例时用；空 = 单个实例。插入位置固定在 `vc-` 之后，改它等于丢历史。
        namespace: ''

        # 本插件用哪个 VoceChat 用户身份说话（必须和传输行的 uid 一致），用于丢弃自己发的回声。
        selfUid: 0

        # 会话用哪个 preset 供给。`companion` 是人格与记忆都挂在的那个。
        presetId: 'companion'

        # 会话的工作目录（绝对路径）。为空则适配层不驱动任何回合，并在日志里明说。
        cwd: ''

        # 可选的模型覆盖。留空 = 用宿主当前默认路由。
        provider: ''
        model: ''

        # ── 门控。**fail-closed**：allowUsers 为空数组时一条都不驱动。
        # 现有部署里说话的人只有 uid=1（凡博），所以这里默认只放他。
        #
        # **2026-11-18 起这条白名单只管私聊。** 频道里有好几个人（实测 members=[1,2,4,5]），
        # 用白名单会把其他成员全部拒掉，所以频道另走 `group` 那一档：频道白名单 + 成员 + 概率。
        # `allowUsers` 在频道上的唯一作用退化成"成员表读不到时的兜底"。
        allowUsers: [1]
        allowGroups: [1]

        # ── 频道（群聊）这一档（2026-11-18）。
        # 三处分档都从这里读：门控（成员 + 概率）、上下文（自上次发言以来的历史）、
        # 表达（3 段 / 单段 120 字）、以及"群里沉默合法"。
        group:
          enabled: true
          # 这一句接不接。0 = 群里永不主动开口（仍然落盘、仍然可查）；1 = 有成员说话就接。
          # 0.3 是起点：群里三句接一句。跑一天看 `chanceSkips` 与 `silences` 再调。
          talkProbability: 0.3
          # 上下文取多少条。平台 history 封顶 100，写更多也只会被夹到 100。
          historyLimit: 20
          # 成员表缓存。60 秒挡掉"每条消息各查一次"，又不至于让新入群的人等太久。
          memberCacheMs: 60000
          # 群里沉默是合法的：false = 不注入兜底纠正，只记一行 model-silence。
          # 想恢复"必须发言"就改成 true（不建议：群聊里那是机器人行为）。
          allowCorrection: false
          # 群聊的表达档。段数是目标，字数是硬上限；两者冲突时不丢字（允许超段）。
          segmentation:
            maxSegments: 3
            maxChars: 120

        # 同房间串行；全局并发默认 1（一个人同时说三件事时，串行比三路并发更像人）。
        concurrency: 1

        # 队列上限：超限即拒绝并记 sent-log，不无限增长。
        maxPending: 200

        # 单回合上限。到点中止并记 undelivered，不发半成品。
        turnTimeoutMs: 180000

        # 单条文本硬上限（字符）。超出在这个值附近按自然边界切分。
        sendMaxChars: 4000

        # ── 入站攒批（对齐 QQ 的 DmBuffer）。
        # 人打字是一条一条发出来的（「在吗」→「问你个事」→「昨天那个文件你放哪了」）。
        # 逐条驱动模型的话，第一条单独触发一轮「在的」，第三条才真问到事情 ——
        # 从手机上看就是"她一条条答得很碎、答不到点上"。
        batching:
          enabled: true
          # 短句等得久（多半还有下文），长句等得短（基本说完了）。按字数在这两者间插值。
          shortMs: 6000
          longMs: 1500
          longChars: 80
          # 总等待上限，从**这一批第一条**算起。没有它，一直说话的人能把它无限推后。
          maxWaitMs: 15000
          # 攒够就立刻交付，不等安静窗口。
          maxMessages: 8
          maxChars: 4000

        # ── 媒体投递（对齐 companion-media 的 channelBoundary）。
        # `roots` 只列额外目录；会话 cwd（工作区）永远在允许列表第一位。
        # 不默认放行整个 data/：那里有凭据、会话日志、别人的附件 —— 把它们发给对话对象
        # 是不可撤销的泄漏，而"多发一个目录"只需要改一行。
        media:
          enabled: true
          roots: []
          # 与 VoceChat 服务端的 send_image_limit（20 MB）对齐。
          maxSendBytes: 20971520
          maxReceiveBytes: 12582912
          downloadTimeoutMs: 120000

          # ── 缩略图升级。
          # 桌面端（exe / 网页）显示的是服务端那张缩略图，不是原图。服务端把长边压到
          # 480px，再撑进 480 CSS px 的盒子、高 DPI 屏乘 DPR —— 于是"不放大看就是糊的"。
          # 这里在发送前用 ffmpeg 重做一张长边 1080 的覆盖掉它。
          # uploadRoot 指向**宿主机上** VoceChat 的 upload 目录（容器的挂载点）。
          # ffmpeg 不可用时退回"用原图覆盖"：重一些，但至少是清楚的。
          thumbnail:
            enabled: true
            uploadRoot: 'D:/DSH/vocechat/vocechat-data/upload'
            longEdge: 1080
            ffmpegPath: 'ffmpeg'
            timeoutMs: 30000

        # 分段发送：一条长回复拆成几条"像人连着说"的消息。
        segmentation:
          enabled: true
          # active 认换行 —— 人设一行一句、常不带句号，不认换行等于没有分段。
          style: 'active'
          maxSegments: 6
          # 分段之间的停顿：按刚发出去那句的字数计时，**照抄 QQ 线上 profile 那一组**。
          # 一句 15 字停 2.1 秒，长句最多停 5 秒；0 = 不额外等待（同一瞬间刷出几条）。
          #
          # 注意别把它当成"QQ 源码默认值"的 60/200/3000：QQ 代码里那组数字是源码默认，
          # 线上 profile 早改成 140/700/5000 了。用户记得的"字越多间隔越长"，是后者。
          delayPerCharMs: 140
          delayMinMs: 700
          delayMaxMs: 5000
          # 一次发送所有停顿的总额上限。超了按比例压缩，保住"长句停得久"的形状。
          # 这里必须同步发（QQ 那边尾段是后台发的），不封顶就可能撞上看门狗。
          delayTotalMaxMs: 20000

        # 兜底纠正的文本（一轮一次，不重放工具）。留空用内置文案（带房间目标）。
        correctionText: ''

        # ── 频道自主链路（2026-11-20）。出厂关；装上插件不该立刻在群里自己说话。
        #
        # 两件事，别混：
        #   门控（上面 group.talkProbability）  回答「这一句接不接」
        #   自主链路                            回答「这一句**该不该**接」
        # 判断由 QQ 插件发布（companionJudge），复用同一张九门决策表。
        # 取不到判断端口就不起定时器（判断不了就不说话），每 8 秒重试一次。
        autonomy:
          enabled: false
          # live = 真的发；shadow = 判断跑、落盘、一句不发；off = 不跑。认不出的一律 off。
          mode: 'off'
          # 每群判一次的最小间隔。
          judgeIntervalMs: 60000
          # 旁听环的上限（长跑进程不许把它养成泄漏）。
          ambientMaxEntries: 40
          ambientMaxChars: 6000
          ambientTtlMs: 600000
          # 三道发言闸。silent **不占**每小时额度。
          speakMinIntervalMs: 300000
          speakMaxPerHour: 3
          replyMaxChars: 70
          # 刚跑完一轮回合的这段窗口内不判（避免"刚回完又补一句"）。
          quietAfterTurnMs: 60000
          replayWindowMs: 600000
          # 同一句短语的重复冷却。短语库只有 13 条、判断又稳定，实测会连说三遍；
          # 换说法等于临时生成，所以宁可不开口。0 = 关掉。
          phraseRepeatWithinMs: 1800000
