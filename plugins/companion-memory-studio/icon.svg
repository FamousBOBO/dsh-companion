<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="cmx-icon-title">
  <title id="cmx-icon-title">记忆档案</title>
  <defs>
    <linearGradient id="cmx-bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#101829"/>
      <stop offset="0.62" stop-color="#131d31"/>
      <stop offset="1" stop-color="#0b1224"/>
    </linearGradient>
    <linearGradient id="cmx-box" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#22314e"/>
      <stop offset="1" stop-color="#18233a"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#cmx-bg)" stroke="#293650" stroke-width="1.5"/>

  <!-- 星轨：一串渐亮的微光从档案盒后升起，末端是一颗四角星。
       用独立圆点而不是虚线，任何 SVG 渲染器（浏览器 / 插件面板）都能稳定显示。 -->
  <circle cx="23.3" cy="27.5" r="0.85" fill="#91abff" opacity="0.5"/>
  <circle cx="26.9" cy="25.0" r="1.0" fill="#b39bd8" opacity="0.65"/>
  <circle cx="32.8" cy="21.6" r="1.15" fill="#f293bd" opacity="0.8"/>
  <circle cx="39.6" cy="18.8" r="1.25" fill="#e6a6c6" opacity="0.92"/>
  <circle cx="44.6" cy="17.1" r="1.35" fill="#72d8c8" opacity="1"/>
  <circle cx="16.4" cy="20.6" r="0.7" fill="#91abff" opacity="0.4"/>
  <circle cx="30.2" cy="12.8" r="0.75" fill="#f293bd" opacity="0.5"/>
  <path d="M50.4 8.6 l1.7 4.9 4.9 1.7 -4.9 1.7 -1.7 4.9 -1.7 -4.9 -4.9 -1.7 4.9 -1.7 z"
        fill="#fdf3f8" opacity="0.96"/>

  <!-- 档案盒：盒盖 + 抽屉 + 提手，暗示「记忆是可以被翻检的档案」 -->
  <g stroke="#8fa7d8" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <rect x="15.5" y="25.6" width="33" height="7.4" rx="2.4" fill="#263860"/>
    <path d="M18.4 33 h27.2 v13.4 a3.6 3.6 0 0 1 -3.6 3.6 h-20 a3.6 3.6 0 0 1 -3.6 -3.6 z"
          fill="url(#cmx-box)"/>
    <path d="M22.6 33 v16.9 M41.4 33 v16.9" stroke="#2b3d63" stroke-width="1.1"/>
  </g>
  <rect x="26.8" y="39.4" width="10.4" height="4.1" rx="2" fill="#f293bd" opacity="0.92"/>
  <path d="M22.8 48.4 h7.6" stroke="#72d8c8" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
  <path d="M33.6 48.4 h7.6" stroke="#8fa7d8" stroke-width="1.6" stroke-linecap="round" opacity="0.45"/>
</svg>
