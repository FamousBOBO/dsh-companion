# 星穹记忆档案（companion-memory-studio）的 bundle 补丁。
#
# 只插入一行：Host 半在 package 的 index.js（共享记忆引擎服务 + 鉴权 HTTP API），
# Client 半在 package.json 的 dsh.client（侧栏「记忆档案」入口 + 7 页工作台）。
